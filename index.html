<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trade Edge - Options Ratio Spread Terminal</title>
    <meta name="description" content="Real-time institutional-grade Trade Edge options ratio spread terminal with live Angel One SmartAPI streaming, exchange-aware strike grid, customizable ratios, executable pricing, and multi-leg risk payoff analytics." />
    <meta property="og:title" content="Trade Edge - Options Ratio Spread Terminal" />
    <meta property="og:description" content="Real-time institutional-grade Trade Edge options ratio spread terminal with live Angel One SmartAPI streaming, exchange-aware strike grid, customizable ratios, executable pricing, and multi-leg risk payoff analytics." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 dark:bg-[#0b0f19] text-slate-900 dark:text-slate-100 antialiased font-sans selection:bg-emerald-500/30 selection:text-emerald-800 dark:selection:text-emerald-200 min-h-screen w-full max-w-full overflow-x-hidden">
    <div id="root">
      <div style="min-height: 100vh; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0b0f19; color: #f8fafc; font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-font-smoothing: antialiased; margin: 0; padding: 0;">
        <div style="display: flex; flex-direction: column; align-items: center; text-align: center; width: 100%; max-width: 448px; height: 176px; margin: 0; padding: 0;">
          <!-- Logo: 40px height + 16px bottom margin -->
          <div style="height: 40px; width: 40px; margin-bottom: 16px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 2L3 7V17L12 22L21 17V7L12 2Z" stroke="#2563eb" stroke-width="2.4" stroke-linejoin="round" />
              <path d="M12 6L7.5 8.5V13.5L12 16L16.5 13.5V8.5L12 6Z" fill="#2563eb" fill-opacity="0.18" stroke="#2563eb" stroke-width="1.8" stroke-linejoin="round" />
              <circle cx="12" cy="11" r="2.2" fill="#2563eb" />
            </svg>
          </div>

          <!-- Title: 28px height + 20px bottom margin -->
          <div style="height: 28px; line-height: 28px; font-weight: 700; font-size: 20px; letter-spacing: -0.03em; margin-bottom: 20px; color: #ffffff; flex-shrink: 0; user-select: none;">
            Trade<span style="color: #3b82f6; font-weight: 800;">Edge</span>
          </div>

          <!-- Spinner: 32px height + 16px bottom margin -->
          <div style="height: 32px; width: 32px; margin-bottom: 16px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
            <div style="width: 28px; height: 28px; border: 2.5px solid rgba(37,99,235,0.25); border-top-color: #2563eb; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
          </div>

          <!-- Status Tip: 24px height -->
          <div style="height: 24px; line-height: 24px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; max-width: 90vw; overflow: hidden;">
            <p style="font-size: 13px; font-weight: 500; letter-spacing: -0.01em; color: #94a3b8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 0; padding: 0;">
              Loading workspace...
            </p>
          </div>
        </div>
      </div>
      <style>
        @keyframes spin { to { transform: rotate(360deg); } }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
